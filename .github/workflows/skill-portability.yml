name: Skill portability

on:
  pull_request:
    paths: ["skills/clif-icu/**", "agents/**", ".claude-plugin/**", "tests/test_skill_resources.py", ".github/workflows/skill-portability.yml"]
  push:
    paths: ["skills/clif-icu/**", "agents/**", ".claude-plugin/**", "tests/test_skill_resources.py", ".github/workflows/skill-portability.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resources:
    name: Resources (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: python tests/test_skill_resources.py
